[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "chore-dispatcher"
version = "0.1.0"
description = "Chore Dispatcher 3.0 greenfield implementation"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "Proprietary" }
dependencies = [
    "fastapi",
    "httpx",
    "mcp",
    "pydantic",
    "uvicorn",
]

[project.scripts]
chore-dispatcher = "chore_dispatcher.cli:main"

[tool.setuptools]
packages = ["chore_dispatcher"]

[tool.ruff]
line-length = 100
target-version = "py311"
