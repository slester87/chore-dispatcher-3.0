# Core configuration defaults
node_id = 0
store_root = "../skips_chores"

tmux_session = "chore-dispatcher"
tmux_enabled = true
signal_dir = "/tmp/kiro_signals"

http_host = "127.0.0.1"
http_port = 8080
mcp_path = "/mcp"
kiro_command = "/Applications/Kiro CLI.app/Contents/MacOS/kiro-cli chat --trust-tools @chore-dispatcher,read,write,web_fetch,web_search,grep,glob,shell,code"

auto_advance_plan_seconds = 5
auto_advance_work_seconds = 10
auto_advance_plan_review_seconds = 3
auto_advance_work_review_seconds = 5

default_log_level = "INFO"

# Paths
active_store_path = "data/active_chores.jsonl"
archive_store_path = "data/archive_chores.jsonl"
